services:
  hugo:
    container_name: hugo
    restart: unless-stopped
    image: hugomods/hugo:exts
    command: hugo server --bind 0.0.0.0 -D --poll 700 --noHTTPCache
    volumes:
      - ./:/src
      - hugo_cache:/tmp/hugo_cache
    ports:
      - "1313:1313"
  tailwind:
    image: node:22-alpine
    working_dir: /src
    volumes:
      - .:/src
    stdin_open: true
    tty: true
    command: sh -c "npm install && npm run tw:build"



volumes:
  hugo_cache: