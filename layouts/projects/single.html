{{ define "main" }}

<article class="max-w-4xl mx-auto">

  <header class="mb-12">

    <h1 class="text-5xl font-bold mb-4">
      {{ .Title }}
    </h1>

    {{ with .Params.description }}
    <p class="text-xl text-zinc-400">
      {{ . }}
    </p>
    {{ end }}

  </header>

  <section class="flex gap-4 mb-10 flex-wrap">

    {{ with .Params.github }}

    <a
      href="{{ . }}"
      target="_blank"
      class="px-5 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 transition"
    >
      GitHub
    </a>

    {{ end }}

    {{ with .Params.demo }}

    <a
      href="{{ . }}"
      target="_blank"
      class="px-5 py-3 rounded-xl bg-zinc-100 text-black hover:bg-zinc-300 transition"
    >
      Live Demo
    </a>

    {{ end }}

  </section>

  {{ with .Params.tech }}

  <section class="mb-12">

    <h2 class="text-2xl font-semibold mb-4">
      Tech Stack
    </h2>

    <div class="flex flex-wrap gap-3">

      {{ range . }}

      <span class="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-800">
        {{ . }}
      </span>

      {{ end }}

    </div>

  </section>

  {{ end }}

  <section class="prose prose-zinc max-w-none">

    {{ .Content }}

  </section>

</article>

{{ end }}
