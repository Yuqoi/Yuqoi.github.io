{{ define "main" }}

<h1 class="text-4xl font-bold leading-none mb-2">
    {{ .Title }}
</h1>

{{ .Content }}

<div / class="border-t border-footer-line border-l-zinc-600"> </div>

<div class="mt-6">
    <ul class="space-y-2">
        {{ range .Pages }}
            <li class="">
                <a
                    href="{{ .RelPermalink }}" class="
                        inline-flex items-center gap-3
                        px-4 py-3
                        group
                        text-zinc-900 w-fit">
                    <span class="group-hover:text-zinc-600 font-bold text-xl leading-none">#{{ .Title }}</span>
                    <i class="ti ti-arrow-right group-hover:text-zinc-600"></i>
                </a>
            </li>
        {{ end }}
    </ul>
</div>

{{ end }}
