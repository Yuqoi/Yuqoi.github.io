{{ define "main" }}

<h1 class="text-4xl font-bold mb-10">
  Blog
</h1>

<div class="space-y-4">

  {{ range .Pages }}

  <a href="{{ .RelPermalink }}"
     class="block border border-zinc-800 p-5 rounded-xl">

    <div class="flex justify-between">
      <span>{{ .Title }}aaccd</span>

      <span class="text-zinc-500">
        {{ .Date.Format "2006-01-02" }}
      </span>
    </div>

  </a>

  {{ end }}

</div>

{{ end }}
