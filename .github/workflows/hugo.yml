name: Build and deploy

on:
  push:
    branches:
      - main
      - deploy-test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.160.0
      NODE_VERSION: 24.14.1
      TZ: Europe/Warsaw

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          path: current

      - name: Checkout main branch
        if: github.ref == 'refs/heads/deploy-test'
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
          path: main-site

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build main site from main branch
        if: github.ref == 'refs/heads/deploy-test'
        working-directory: main-site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          NODE_ENV: production
        run: |
          npm ci --include=dev
          npm run tw:build
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --destination ../final-public \
            --cacheDir "${{ runner.temp }}/hugo_cache_main"

      - name: Build current branch as main site
        if: github.ref == 'refs/heads/main'
        working-directory: current
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          NODE_ENV: production
        run: |
          npm ci --include=dev
          npm run tw:build
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --destination ../final-public \
            --cacheDir "${{ runner.temp }}/hugo_cache_main"

      - name: Build deploy-test into /dev
        if: github.ref == 'refs/heads/deploy-test'
        working-directory: current
        env:
          HUGO_ENVIRONMENT: development
          HUGO_ENV: development
          NODE_ENV: production
        run: |
          npm ci --include=dev
          npm run tw:build
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/dev/" \
            --destination ../final-public/dev \
            --cacheDir "${{ runner.temp }}/hugo_cache_dev"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./final-public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5